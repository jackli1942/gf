# GoFrame Configuration for Yuncms (Development Defaults)

# Server Configuration
server:
  address: ":8082" # Changed port to 8081
  serverRoot: "resource/public"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  dumpRouterMap: true

# Logger Configuration
logger:
  path: "storage/logs"
  level: "all"
  stdout: true

# Database Configuration (MySQL)
database:
  default:
    link: "mysql:root:@tcp(127.0.0.1:3306)/yuncms_dev?charset=utf8mb4&parseTime=true&loc=Local"
    debug: true
    maxIdle: 10
    maxOpen: 100
    maxLifetime: "30m"

# Redis Configuration
redis:
  default:
    address: "127.0.0.1:6379"
    db: 0

# JWT Configuration
jwt:
  realm: "yuncms"
  key: "DefaultSecretKeyForYuncmsJWTDevelopment"
  timeout: "12h"
  maxRefresh: "3h"

# Application specific settings
application:
  name: "Yuncms"
  version: "0.1.0"
  defaultLanguage: "zh"
  i18nPath: "resource/i18n"

# Queue (Asynq) Configuration
queue:
  redisAddr: "127.0.0.1:6379"
  redisPassword: ""
  redisDB: 1

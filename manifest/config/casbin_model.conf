# Casbin RBAC Model Configuration for Yuncms

# Request Definition
# Defines the structure of an access request: subject, object, action
[request_definition]
r = sub, obj, act

# Policy Definition
# Defines the structure of a policy rule: subject, object, action
[policy_definition]
p = sub, obj, act

# Role Definition
# Defines role hierarchy (inheritance)
# g = _, _ means user/role inherits from another role
# g2 = _, _ can be used for specific domain/tenant roles if needed
[role_definition]
g = _, _
# g2 = _, _

# Policy Effect
# Defines how policy rules are evaluated if multiple rules match
# e = some(where (p.eft == allow)) means if any matching policy rule allows, the request is allowed.
# This is a common default.
[policy_effect]
e = some(where (p.eft == allow))

# Matchers
# Defines how access requests are matched against policy rules.
# Old matcher: m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
# New matcher supports path wildcards (keyMatch2) and action wildcard (*).
[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
# This matcher allows for:
# - Role inheritance via g(r.sub, p.sub).
# - Path matching with wildcards (e.g., /api/v1/users/*) via keyMatch2.
#   keyMatch2 also supports RESTful path parameters like /api/v1/users/:id if policies use them.
# - Action wildcard: A policy with p.act == "*" will match any r.act.
```

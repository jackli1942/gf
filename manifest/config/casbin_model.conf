# Casbin RBAC Model Configuration for Yuncms

# Request Definition
# Defines the structure of an access request: subject, object, action
[request_definition]
r = sub, obj, act

# Policy Definition
# Defines the structure of a policy rule: subject, object, action
[policy_definition]
p = sub, obj, act

# Role Definition
# Defines role hierarchy (inheritance)
# g = _, _ means user/role inherits from another role
# g2 = _, _ can be used for specific domain/tenant roles if needed
[role_definition]
g = _, _
# g2 = _, _

# Policy Effect
# Defines how policy rules are evaluated if multiple rules match
# e = some(where (p.eft == allow)) means if any matching policy rule allows, the request is allowed.
# This is a common default.
[policy_effect]
e = some(where (p.eft == allow))

# Matchers
# Defines how access requests are matched against policy rules.
# m = r.sub == p.sub && r.obj == p.obj && r.act == p.act
# This is a standard matcher for exact subject, object, and action.
# More complex matchers can be added (e.g., with keyMatch2 for path matching).
[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
# This matcher allows for role inheritance:
# If the subject (r.sub) is a member of a role (p.sub) defined in a policy,
# and the object and action match, access is granted.
# For direct user permissions without roles, p.sub would be the user's ID/name.
